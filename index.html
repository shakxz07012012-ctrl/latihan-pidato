<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>FlowCraft — Flowchart Maker</title>
<style>
:root{
  --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
  --topbar-h:52px; --toolbar-h:48px; --sidebar-w:64px; --props-w:280px;
}
:root[data-theme="dark"]{
  --bg:#14161b; --panel:#1b1e25; --panel-2:#20242c; --panel-3:#262b34;
  --border:#2c313b; --border-soft:#232730;
  --text:#e6e8eb; --text-dim:#9aa3af; --text-faint:#6b7280;
  --accent:#5b8def; --accent-2:#3d6bd0; --accent-soft:#5b8def22;
  --canvas-bg:#0f1115; --grid:#22262e; --grid-strong:#2a2f39;
  --danger:#e5484d; --success:#3ecf8e; --warn:#e2a03f;
  --shadow:rgba(0,0,0,.45);
  --node-fill:#232833; --node-text:#e6e8eb; --node-border:#4a5468;
}
:root[data-theme="light"]{
  --bg:#eef0f3; --panel:#ffffff; --panel-2:#f7f8fa; --panel-3:#eef0f3;
  --border:#dde1e7; --border-soft:#e7eaee;
  --text:#1b1e24; --text-dim:#5b6472; --text-faint:#8a919c;
  --accent:#3b6fe0; --accent-2:#2f5bc4; --accent-soft:#3b6fe01a;
  --canvas-bg:#ffffff; --grid:#eaecef; --grid-strong:#dde1e7;
  --danger:#d1373d; --success:#1f9d64; --warn:#b6790f;
  --shadow:rgba(20,20,30,.12);
  --node-fill:#ffffff; --node-text:#1b1e24; --node-border:#b9c0cc;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;}
button{font-family:inherit;}
#app{display:flex;flex-direction:column;height:100%;width:100%;}

/* ---------- TOPBAR ---------- */
#topbar{height:var(--topbar-h);flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border);}
#topbar .brand{font-weight:700;font-size:15px;letter-spacing:.2px;color:var(--text);display:flex;align-items:center;gap:6px;flex:0 0 auto;}
#topbar .brand .dot{width:8px;height:8px;border-radius:2px;background:var(--accent);}
#status-text{font-size:12px;color:var(--text-faint);flex:0 0 auto;white-space:nowrap;}
#search-wrap{flex:1 1 auto;max-width:320px;position:relative;display:flex;align-items:center;}
#search-input{width:100%;height:32px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-md);padding:0 10px 0 30px;font-size:13px;outline:none;}
#search-input:focus{border-color:var(--accent);}
#search-wrap svg{position:absolute;left:8px;width:14px;height:14px;color:var(--text-faint);pointer-events:none;}
#search-count{font-size:11px;color:var(--text-faint);margin-left:6px;white-space:nowrap;}
.spacer{flex:1 1 auto;}
.icon-btn{width:32px;height:32px;border-radius:var(--radius-md);border:1px solid transparent;background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
.icon-btn:hover{background:var(--panel-2);color:var(--text);}
.icon-btn svg{width:17px;height:17px;}

/* ---------- TOOLBAR ---------- */
#toolbar{height:var(--toolbar-h);flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--panel-2);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;white-space:nowrap;}
#toolbar::-webkit-scrollbar{height:4px;}
#toolbar::-webkit-scrollbar-thumb{background:var(--border);}
.tb-btn{min-width:36px;height:36px;padding:0 8px;border-radius:var(--radius-md);border:1px solid transparent;background:transparent;color:var(--text-dim);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:12px;flex:0 0 auto;}
.tb-btn svg{width:16px;height:16px;flex:0 0 auto;}
.tb-btn:hover{background:var(--panel-3);color:var(--text);}
.tb-btn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.tb-btn:disabled{opacity:.35;cursor:default;}
.tb-btn:disabled:hover{background:transparent;}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 6px;flex:0 0 auto;}
.tb-dropdown{position:relative;flex:0 0 auto;}
.dropdown-menu{position:absolute;top:calc(100% + 4px);left:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:0 8px 24px var(--shadow);min-width:180px;padding:4px;z-index:60;display:none;}
.dropdown-menu.open{display:block;}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;color:var(--text);cursor:pointer;}
.dropdown-item:hover{background:var(--panel-3);}
.dropdown-item svg{width:15px;height:15px;color:var(--text-dim);flex:0 0 auto;}

/* ---------- MAIN LAYOUT ---------- */
#main{flex:1 1 auto;display:flex;min-height:0;position:relative;}
#sidebar{width:var(--sidebar-w);flex:0 0 auto;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;overflow-y:auto;}
.shape-btn{width:48px;height:48px;border-radius:var(--radius-md);border:1px solid transparent;background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
.shape-btn svg{width:24px;height:24px;}
.shape-btn:hover{background:var(--panel-3);color:var(--text);}
.shape-btn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}

#canvas-wrap{flex:1 1 auto;position:relative;overflow:hidden;background:var(--canvas-bg);touch-action:none;}
#svg-canvas{width:100%;height:100%;display:block;cursor:default;}
#svg-canvas.tool-hand{cursor:grab;}
#svg-canvas.panning{cursor:grabbing;}
#svg-canvas.tool-shape{cursor:crosshair;}

#minimap{position:absolute;right:12px;bottom:12px;width:160px;height:110px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;box-shadow:0 6px 18px var(--shadow);z-index:20;}
#minimap.hidden{display:none;}
#minimap svg{width:100%;height:100%;display:block;}

#edit-overlay{position:absolute;z-index:40;display:none;}
#edit-overlay textarea{width:100%;height:100%;resize:none;border:2px solid var(--accent);border-radius:2px;background:var(--node-fill);color:var(--node-text);font-family:inherit;padding:2px 4px;outline:none;text-align:center;overflow:hidden;}

#context-menu{position:absolute;z-index:80;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:0 10px 30px var(--shadow);padding:4px;min-width:190px;display:none;}
#context-menu.open{display:block;}
.ctx-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;color:var(--text);cursor:pointer;}
.ctx-item:hover{background:var(--panel-3);}
.ctx-item .k{color:var(--text-faint);font-size:11px;}
.ctx-sep{height:1px;background:var(--border);margin:4px 2px;}

/* ---------- PROPERTIES PANEL ---------- */
#properties{width:var(--props-w);flex:0 0 auto;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:12px;}
#properties h3{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);margin:14px 0 8px;font-weight:600;}
#properties h3:first-child{margin-top:0;}
.prop-empty{font-size:13px;color:var(--text-faint);padding:20px 4px;text-align:center;}
.prop-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.prop-row label{font-size:12px;color:var(--text-dim);flex:0 0 76px;}
.prop-row input[type="text"],.prop-row input[type="number"],.prop-row select{flex:1 1 auto;height:30px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:0 8px;font-size:12px;min-width:0;}
.prop-row textarea{flex:1 1 auto;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:6px 8px;font-size:12px;resize:vertical;min-height:50px;font-family:inherit;}
.prop-row input[type="color"]{width:36px;height:30px;padding:0;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2);flex:0 0 auto;}
.prop-row input[type="range"]{flex:1 1 auto;}
.prop-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.prop-grid2 .g-item label{display:block;font-size:11px;color:var(--text-faint);margin-bottom:3px;}
.prop-grid2 .g-item input{width:100%;height:30px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:0 8px;font-size:12px;}
.seg{display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;flex:1 1 auto;}
.seg button{flex:1 1 auto;height:30px;background:var(--panel-2);border:none;border-right:1px solid var(--border);color:var(--text-dim);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--accent-soft);color:var(--accent);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.toggle-row label{font-size:12px;color:var(--text-dim);}
.switch{width:38px;height:22px;border-radius:11px;background:var(--panel-3);border:1px solid var(--border);position:relative;cursor:pointer;flex:0 0 auto;}
.switch.on{background:var(--accent);border-color:var(--accent);}
.switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .12s;}
.switch.on .knob{left:18px;}
.btn{height:32px;padding:0 12px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn:hover{background:var(--panel-3);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-2);}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent;}
.btn.danger:hover{background:var(--danger);color:#fff;}
.btn.block{width:100%;}
.btn-row{display:flex;gap:8px;margin-top:4px;}

/* ---------- MODALS ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px var(--shadow);}
.modal.wide{max-width:840px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex:0 0 auto;}
.modal-head h2{font-size:15px;margin:0;font-weight:600;}
.modal-body{padding:16px;overflow-y:auto;flex:1 1 auto;}
.modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex:0 0 auto;}

#mermaid-modal .modal-body{display:flex;gap:14px;flex-wrap:wrap;}
#mermaid-input-col,#mermaid-preview-col{flex:1 1 260px;min-width:240px;display:flex;flex-direction:column;}
#mermaid-code{width:100%;min-height:280px;flex:1 1 auto;background:var(--canvas-bg);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text);font-family:ui-monospace,"Cascadia Code","Source Code Pro",Menlo,monospace;font-size:12.5px;padding:10px;resize:none;outline:none;line-height:1.5;}
#mermaid-error{font-size:12px;color:var(--danger);margin-top:8px;min-height:16px;}
#mermaid-preview-box{flex:1 1 auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--canvas-bg);min-height:280px;overflow:auto;display:flex;align-items:center;justify-content:center;}
.field-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px;}

#templates-modal .tpl-search{width:100%;height:34px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-md);padding:0 10px;margin-bottom:12px;font-size:13px;}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.tpl-card{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--panel-2);padding:10px;cursor:pointer;text-align:left;}
.tpl-card:hover{border-color:var(--accent);}
.tpl-card .tpl-icon{width:100%;height:64px;background:var(--panel-3);border-radius:var(--radius-sm);margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);}
.tpl-card .tpl-icon svg{width:28px;height:28px;}
.tpl-card .tpl-name{font-size:12.5px;color:var(--text);font-weight:500;}

#settings-modal .set-section{margin-bottom:18px;}
#projects-list{display:flex;flex-direction:column;gap:6px;}
.proj-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--panel-2);}
.proj-row .pinfo{flex:1 1 auto;min-width:0;}
.proj-row .pname{font-size:13px;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.proj-row .pmeta{font-size:11px;color:var(--text-faint);}
.proj-row .pactions{display:flex;gap:4px;flex:0 0 auto;}

/* ---------- TOAST ---------- */
#toast-container{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:var(--radius-md);font-size:13px;box-shadow:0 8px 24px var(--shadow);display:flex;align-items:center;gap:8px;animation:toast-in .18s ease-out;max-width:280px;}
.toast.success{border-color:var(--success);}
.toast.error{border-color:var(--danger);}
.toast .tdot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex:0 0 auto;}
.toast.success .tdot{background:var(--success);}
.toast.error .tdot{background:var(--danger);}
@keyframes toast-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.hidden{display:none !important;}

/* ---------- MOBILE ---------- */
@media (max-width:840px){
  :root{--sidebar-w:52px;}
  #topbar{padding:0 8px;gap:6px;}
  #topbar .brand span.brand-text{display:none;}
  #search-wrap{max-width:none;}
  #status-text{display:none;}
  #sidebar{display:none;}
  #properties{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;max-height:60vh;border-left:none;border-top:1px solid var(--border);border-radius:14px 14px 0 0;transform:translateY(100%);transition:transform .2s ease-out;z-index:55;box-shadow:0 -10px 30px var(--shadow);}
  #properties.sheet-open{transform:translateY(0);}
  #properties .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 10px;}
  #main{position:relative;}
  .modal{max-height:82vh;}
  #mermaid-modal .modal-body{flex-direction:column;}
  #minimap{width:110px;height:78px;}
  .tb-btn{min-width:40px;height:40px;}
  .tb-btn .tb-label{display:none;}
}
@media (min-width:841px){
  #properties .sheet-handle{display:none;}
  #mobile-props-close{display:none;}
}
</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand"><span class="dot"></span><span class="brand-text">FlowCraft</span></div>
    <div id="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="Cari node, teks, atau template...">
    </div>
    <span id="search-count"></span>
    <span id="status-text">Belum disimpan</span>
    <div class="spacer"></div>
    <button class="icon-btn" id="btn-theme" title="Ganti tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
    </button>
    <button class="icon-btn" id="btn-fullscreen" title="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/></svg>
    </button>
  </header>

  <div id="toolbar"></div>

  <div id="main">
    <aside id="sidebar"></aside>

    <div id="canvas-wrap">
      <svg id="svg-canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0H0V20" fill="none" stroke="var(--grid)" stroke-width="1"/>
          </pattern>
          <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="context-fill"/>
          </marker>
        </defs>
        <g id="viewport">
          <rect id="grid-rect" x="-4000" y="-4000" width="8000" height="8000" fill="url(#grid-pattern)"/>
          <g id="edges-layer"></g>
          <g id="nodes-layer"></g>
          <g id="overlay-layer"></g>
        </g>
      </svg>
      <div id="minimap"><svg viewBox="0 0 160 110" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div id="edit-overlay"><textarea spellcheck="false"></textarea></div>
      <div id="context-menu"></div>
    </div>

    <aside id="properties"><div class="sheet-handle"></div><div id="properties-content"></div></aside>
  </div>

  <!-- Mermaid modal -->
  <div class="modal-backdrop" id="mermaid-backdrop">
    <div class="modal wide" id="mermaid-modal">
      <div class="modal-head"><h2>Mermaid Editor</h2><button class="icon-btn" data-close="mermaid-backdrop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
      <div class="modal-body">
        <div id="mermaid-input-col">
          <div class="field-label">Kode Mermaid</div>
          <textarea id="mermaid-code" placeholder="flowchart TD&#10;A([Mulai]) --> B[Input Data]"></textarea>
          <div id="mermaid-error"></div>
          <div class="btn-row">
            <button class="btn primary" id="mm-render">Render Flowchart</button>
            <button class="btn" id="mm-format">Format Code</button>
            <button class="btn" id="mm-copy">Copy Code</button>
            <button class="btn" id="mm-download">Download</button>
            <button class="btn danger" id="mm-clear">Clear</button>
          </div>
        </div>
        <div id="mermaid-preview-col">
          <div class="field-label">Preview</div>
          <div id="mermaid-preview-box"></div>
          <div class="btn-row">
            <button class="btn block" id="mm-to-visual">Visual → Mermaid (dari canvas)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Templates modal -->
  <div class="modal-backdrop" id="templates-backdrop">
    <div class="modal wide" id="templates-modal">
      <div class="modal-head"><h2>Template</h2><button class="icon-btn" data-close="templates-backdrop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
      <div class="modal-body">
        <input class="tpl-search" id="tpl-search" placeholder="Cari template...">
        <div class="tpl-grid" id="tpl-grid"></div>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div class="modal-backdrop" id="settings-backdrop">
    <div class="modal" id="settings-modal">
      <div class="modal-head"><h2>Settings</h2><button class="icon-btn" data-close="settings-backdrop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
      <div class="modal-body" id="settings-body"></div>
    </div>
  </div>

  <!-- Projects modal -->
  <div class="modal-backdrop" id="projects-backdrop">
    <div class="modal" id="projects-modal">
      <div class="modal-head"><h2>Proyek</h2><button class="icon-btn" data-close="projects-backdrop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
      <div class="modal-body"><div id="projects-list"></div></div>
      <div class="modal-foot"><button class="btn primary" id="proj-new-btn">+ Proyek Baru</button></div>
    </div>
  </div>

  <div id="toast-container"></div>
</div>
<script>
(function(){
'use strict';
/* ================= CONSTANTS ================= */
var SVGNS = 'http://www.w3.org/2000/svg';
var STORAGE_KEY = 'flowcraft_projects_v1';
var SETTINGS_KEY = 'flowcraft_settings_v1';

var SHAPES = [
  {id:'start-end', label:'Start / End'},
  {id:'process', label:'Process'},
  {id:'decision', label:'Decision'},
  {id:'io', label:'Input / Output'},
  {id:'document', label:'Document'},
  {id:'database', label:'Database'},
  {id:'preparation', label:'Preparation'},
  {id:'manual-input', label:'Manual Input'},
  {id:'predefined', label:'Predefined Process'},
  {id:'delay', label:'Delay'},
  {id:'display', label:'Display'},
  {id:'connector', label:'Connector'},
  {id:'subprocess', label:'Subprocess'},
  {id:'comment', label:'Comment / Note'}
];
var SHAPE_LABEL = {}; SHAPES.forEach(function(s){SHAPE_LABEL[s.id]=s.label;});
var SHAPE_DEFAULT_SIZE = {
  'start-end':[120,50],'process':[130,60],'decision':[120,90],'io':[130,60],
  'document':[130,64],'database':[110,70],'preparation':[130,60],'manual-input':[130,64],
  'predefined':[140,60],'delay':[120,56],'display':[130,56],'connector':[56,56],
  'subprocess':[140,64],'comment':[150,60]
};

function uid(prefix){ return (prefix||'n') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

/* ================= STATE ================= */
var state = {
  meta: { id: uid('proj'), name: 'Untitled Flowchart', updatedAt: Date.now() },
  nodes: [],
  edges: [],
  viewport: { x: 0, y: 0, scale: 1 },
  settings: {
    snap: true, showGrid: true, gridSize: 20, autosave: true, showMinimap: true,
    theme: 'dark', bg: 'grid'
  }
};

var sel = { nodes: new Set(), edges: new Set() };
var clipboard = null;
var dirty = false;

var tool = 'select'; // select, hand, shape, connector, text
var armedShape = null;

/* ================= HISTORY (undo/redo) ================= */
var historyStack = [];
var historyIndex = -1;
var HISTORY_MAX = 60;

function snapshot(){
  return JSON.stringify({nodes: state.nodes, edges: state.edges});
}
function pushHistory(){
  var snap = snapshot();
  if (historyIndex >= 0 && historyStack[historyIndex] === snap) return;
  historyStack = historyStack.slice(0, historyIndex + 1);
  historyStack.push(snap);
  if (historyStack.length > HISTORY_MAX) historyStack.shift();
  historyIndex = historyStack.length - 1;
  markDirty();
  updateUndoRedoButtons();
}
function restoreSnapshot(str){
  var data = JSON.parse(str);
  state.nodes = data.nodes; state.edges = data.edges;
  sel.nodes.clear(); sel.edges.clear();
  renderAll(); renderProperties(); updateUndoRedoButtons();
}
function undo(){
  if (historyIndex <= 0) return;
  historyIndex--;
  restoreSnapshot(historyStack[historyIndex]);
  markDirty();
}
function redo(){
  if (historyIndex >= historyStack.length - 1) return;
  historyIndex++;
  restoreSnapshot(historyStack[historyIndex]);
  markDirty();
}
function updateUndoRedoButtons(){
  var u = document.getElementById('tb-undo'), r = document.getElementById('tb-redo');
  if (u) u.disabled = historyIndex <= 0;
  if (r) r.disabled = historyIndex >= historyStack.length - 1;
}

function markDirty(){
  dirty = true;
  setStatus('Belum disimpan');
  if (state.settings.autosave) scheduleAutosave();
}
var autosaveTimer = null;
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(function(){ saveProject(true); }, 900);
}
function setStatus(txt){
  var el = document.getElementById('status-text');
  if (el) el.textContent = txt;
}

/* ================= TOAST ================= */
function toast(msg, type){
  var c = document.getElementById('toast-container');
  var t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.innerHTML = '<span class="tdot"></span><span>' + escapeHtml(msg) + '</span>';
  c.appendChild(t);
  setTimeout(function(){
    t.style.transition = 'opacity .25s'; t.style.opacity = '0';
    setTimeout(function(){ t.remove(); }, 260);
  }, 2200);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ================= GEOMETRY HELPERS ================= */
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function snapVal(v){ return state.settings.snap ? Math.round(v / state.settings.gridSize) * state.settings.gridSize : v; }

function getNode(id){ return state.nodes.find(function(n){ return n.id === id; }); }
function getEdge(id){ return state.edges.find(function(e){ return e.id === id; }); }

function nodeCenter(n){ return { x: n.x + n.w/2, y: n.y + n.h/2 }; }

function sideAnchor(n, side){
  switch(side){
    case 'top': return {x:n.x+n.w/2, y:n.y};
    case 'bottom': return {x:n.x+n.w/2, y:n.y+n.h};
    case 'left': return {x:n.x, y:n.y+n.h/2};
    case 'right': return {x:n.x+n.w, y:n.y+n.h/2};
  }
  return nodeCenter(n);
}

function bestSideForDirection(n, fromPt){
  var c = nodeCenter(n);
  var dx = fromPt.x - c.x, dy = fromPt.y - c.y;
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'right' : 'left';
  return dy > 0 ? 'bottom' : 'top';
}

function screenToWorld(sx, sy){
  var svg = document.getElementById('svg-canvas');
  var rect = svg.getBoundingClientRect();
  var x = (sx - rect.left - state.viewport.x) / state.viewport.scale;
  var y = (sy - rect.top - state.viewport.y) / state.viewport.scale;
  return {x:x, y:y};
}
function worldToScreen(wx, wy){
  var svg = document.getElementById('svg-canvas');
  var rect = svg.getBoundingClientRect();
  return {
    x: wx * state.viewport.scale + state.viewport.x + rect.left,
    y: wy * state.viewport.scale + state.viewport.y + rect.top
  };
}
/* ================= SHAPE PATH BUILDERS ================= */
/* Each returns an SVG path 'd' or tells renderer to use a basic element for a shape of size w x h at local (0,0)-(w,h) */
function shapeGeometry(shape, w, h){
  switch(shape){
    case 'start-end':
      var r = h/2;
      return {tag:'path', d:'M'+r+',0 H'+(w-r)+' A'+r+','+r+' 0 0 1 '+(w-r)+','+h+' H'+r+' A'+r+','+r+' 0 0 1 '+r+',0 Z'};
    case 'process':
      return {tag:'rect', attrs:{x:0,y:0,width:w,height:h,rx:3,ry:3}};
    case 'decision':
      return {tag:'path', d:'M'+(w/2)+',0 L'+w+','+(h/2)+' L'+(w/2)+','+h+' L0,'+(h/2)+' Z'};
    case 'io':
      var sk = h*0.28;
      return {tag:'path', d:'M'+sk+',0 H'+w+' L'+(w-sk)+','+h+' H0 Z'};
    case 'document':
      var wv = h*0.18;
      return {tag:'path', d:'M0,0 H'+w+' V'+(h-wv)+' C'+(w*0.75)+','+(h-wv)+' '+(w*0.75)+','+h+' '+(w*0.5)+','+h+' C'+(w*0.25)+','+(h)+' '+(w*0.25)+','+(h-wv)+' 0,'+(h-wv)+' Z'};
    case 'database':
      var ry = h*0.16;
      return {tag:'path', d:'M0,'+ry+' C0,'+(-ry*0.1)+' '+w+','+(-ry*0.1)+' '+w+','+ry+' V'+(h-ry)+' C'+w+','+(h+ry*0.9)+' 0,'+(h+ry*0.9)+' 0,'+(h-ry)+' Z M0,'+ry+' C0,'+(ry*2.1)+' '+w+','+(ry*2.1)+' '+w+','+ry};
    case 'preparation':
      var cut = w*0.16;
      return {tag:'path', d:'M'+cut+',0 H'+(w-cut)+' L'+w+','+(h/2)+' L'+(w-cut)+','+h+' H'+cut+' L0,'+(h/2)+' Z'};
    case 'manual-input':
      var slant = h*0.28;
      return {tag:'path', d:'M0,'+slant+' L'+w+',0 H'+w+' V'+h+' H0 Z'};
    case 'predefined':
      var bar = w*0.09;
      return {tag:'group', rects:[
        {x:0,y:0,width:w,height:h},
        {x:bar,y:0,width:1.6,height:h,fillOnly:true},
        {x:w-bar,y:0,width:1.6,height:h,fillOnly:true}
      ]};
    case 'delay':
      var r2 = h/2;
      return {tag:'path', d:'M0,0 H'+(w-r2)+' A'+r2+','+r2+' 0 0 1 '+(w-r2)+','+h+' H0 Z'};
    case 'display':
      var r3 = h/2;
      return {tag:'path', d:'M'+(w*0.12)+',0 H'+(w-r3)+' A'+r3+','+r3+' 0 0 1 '+(w-r3)+','+h+' H'+(w*0.12)+' L0,'+(h/2)+' Z'};
    case 'connector':
      var r4 = Math.min(w,h)/2;
      return {tag:'ellipse', attrs:{cx:w/2,cy:h/2,rx:w/2,ry:h/2}};
    case 'subprocess':
      return {tag:'group-subprocess', w:w, h:h};
    case 'comment':
      var fold = Math.min(18, w*0.16, h*0.4);
      return {tag:'path', d:'M0,0 H'+(w-fold)+' L'+w+','+fold+' V'+h+' H0 Z'};
    default:
      return {tag:'rect', attrs:{x:0,y:0,width:w,height:h,rx:3,ry:3}};
  }
}

function el(tag, attrs){
  var e = document.createElementNS(SVGNS, tag);
  if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function buildNodeShapeEls(n){
  var frag = document.createDocumentFragment();
  var geo = shapeGeometry(n.shape, n.w, n.h);
  var style = n.style;
  var baseAttrs = {
    fill: style.bg, stroke: style.border, 'stroke-width': style.borderWidth,
    'stroke-dasharray': style.borderStyle === 'dashed' ? '6,4' : (style.borderStyle === 'dotted' ? '2,3' : 'none'),
    'fill-opacity': style.opacity, 'stroke-opacity': style.opacity
  };
  if (geo.tag === 'path'){
    frag.appendChild(el('path', Object.assign({d:geo.d}, baseAttrs)));
  } else if (geo.tag === 'rect'){
    frag.appendChild(el('rect', Object.assign({}, geo.attrs, baseAttrs)));
  } else if (geo.tag === 'ellipse'){
    frag.appendChild(el('ellipse', Object.assign({}, geo.attrs, baseAttrs)));
  } else if (geo.tag === 'group'){
    geo.rects.forEach(function(r){
      if (r.fillOnly){
        frag.appendChild(el('rect', {x:r.x,y:r.y,width:r.width,height:r.height,fill:style.border,'fill-opacity':style.opacity}));
      } else {
        frag.appendChild(el('rect', Object.assign({x:r.x,y:r.y,width:r.width,height:r.height,rx:3,ry:3}, baseAttrs)));
      }
    });
  } else if (geo.tag === 'group-subprocess'){
    frag.appendChild(el('rect', Object.assign({x:0,y:0,width:geo.w,height:geo.h,rx:2,ry:2}, baseAttrs)));
    frag.appendChild(el('line', {x1:8,y1:0,x2:8,y2:geo.h,stroke:style.border,'stroke-width':style.borderWidth,'stroke-opacity':style.opacity}));
    frag.appendChild(el('line', {x1:geo.w-8,y1:0,x2:geo.w-8,y2:geo.h,stroke:style.border,'stroke-width':style.borderWidth,'stroke-opacity':style.opacity}));
  }
  return frag;
}

function buildTextEl(n){
  var text = el('text', {
    x: n.w/2, y: n.h/2, 'text-anchor': n.font.align === 'left' ? 'start' : (n.font.align === 'right' ? 'end' : 'middle'),
    'dominant-baseline':'central', fill: n.style.color,
    'font-size': n.font.size, 'font-family': n.font.family,
    'font-weight': n.font.weight === 'bold' ? '700':'400',
    'font-style': n.font.italic ? 'italic':'normal',
    'text-decoration': n.font.underline ? 'underline':'none',
    'pointer-events':'none'
  });
  if (n.font.align === 'left') text.setAttribute('x', 8);
  if (n.font.align === 'right') text.setAttribute('x', n.w - 8);
  var lines = String(n.text||'').split('\n');
  var lineH = n.font.size * 1.25;
  var startY = -( (lines.length-1) * lineH )/2;
  lines.forEach(function(ln, i){
    var tspan = el('tspan', {x: text.getAttribute('x'), dy: i===0 ? startY : lineH});
    tspan.textContent = ln;
    text.appendChild(tspan);
  });
  return text;
}

function renderNode(n){
  var g = el('g', {class:'node-g', 'data-id': n.id, transform:'translate('+n.x+','+n.y+')'});
  g.style.cursor = n.locked ? 'not-allowed' : 'move';
  g.appendChild(buildNodeShapeEls(n));
  g.appendChild(buildTextEl(n));

  var isSelected = sel.nodes.has(n.id);
  var isSearchDim = window.__searchActive && !window.__searchMatches.has(n.id);
  if (isSearchDim) g.setAttribute('opacity', '0.25');

  if (isSelected){
    var pad = 5;
    g.appendChild(el('rect', {
      x:-pad, y:-pad, width:n.w+pad*2, height:n.h+pad*2, fill:'none',
      stroke:'var(--accent)', 'stroke-width':1.5, 'stroke-dasharray':'5,3', rx:6, ry:6, class:'sel-outline'
    }));
    if (sel.nodes.size === 1 && !n.locked){
      var handle = el('rect', {
        x:n.w-6, y:n.h-6, width:12, height:12, fill:'var(--accent)', stroke:'#fff','stroke-width':1,
        class:'resize-handle', 'data-node':n.id, style:'cursor:nwse-resize;'
      });
      g.appendChild(handle);
    }
    if (!n.locked){
      ['top','bottom','left','right'].forEach(function(side){
        var a = sideAnchor(n, side);
        var lx = a.x - n.x, ly = a.y - n.y;
        var dot = el('circle', {cx:lx, cy:ly, r:6, fill:'var(--accent)', stroke:'#fff','stroke-width':1.5,
          class:'conn-handle', 'data-node':n.id, 'data-side':side, style:'cursor:crosshair;'});
        g.appendChild(dot);
      });
    }
  }
  if (n.locked){
    g.appendChild(el('text', {x:n.w-4, y:12, 'text-anchor':'end','font-size':11, fill:'var(--text-faint)', 'pointer-events':'none'})).textContent = '\uD83D\uDD12';
  }
  return g;
}

function edgePathD(e, p1, p2, fromSide, toSide){
  if (e.type === 'straight'){
    return 'M'+p1.x+','+p1.y+' L'+p2.x+','+p2.y;
  }
  if (e.type === 'curved'){
    var dx = (p2.x - p1.x) * 0.5, dy = (p2.y - p1.y) * 0.5;
    var c1x = p1.x + (fromSide==='left'?-Math.abs(dx):fromSide==='right'?Math.abs(dx):dx*0.6);
    var c1y = p1.y + (fromSide==='top'?-Math.abs(dy):fromSide==='bottom'?Math.abs(dy):dy*0.6);
    var c2x = p2.x - (toSide==='left'?-Math.abs(dx):toSide==='right'?Math.abs(dx):dx*0.6);
    var c2y = p2.y - (toSide==='top'?-Math.abs(dy):toSide==='bottom'?Math.abs(dy):dy*0.6);
    return 'M'+p1.x+','+p1.y+' C'+c1x+','+c1y+' '+c2x+','+c2y+' '+p2.x+','+p2.y;
  }
  // elbow (default)
  var midx, midy;
  if (fromSide === 'left' || fromSide === 'right'){
    midx = (p1.x + p2.x) / 2;
    return 'M'+p1.x+','+p1.y+' L'+midx+','+p1.y+' L'+midx+','+p2.y+' L'+p2.x+','+p2.y;
  } else {
    midy = (p1.y + p2.y) / 2;
    return 'M'+p1.x+','+p1.y+' L'+p1.x+','+midy+' L'+p2.x+','+midy+' L'+p2.x+','+p2.y;
  }
}

function renderEdge(e){
  var from = getNode(e.from), to = getNode(e.to);
  if (!from || !to) return null;
  var fromSide = e.fromSide || bestSideForDirection(from, nodeCenter(to));
  var toSide = e.toSide || bestSideForDirection(to, nodeCenter(from));
  var p1 = sideAnchor(from, fromSide);
  var p2 = sideAnchor(to, toSide);
  var g = el('g', {class:'edge-g', 'data-id': e.id});
  var d = edgePathD(e, p1, p2, fromSide, toSide);
  var path = el('path', {
    d:d, fill:'none', stroke:e.color, 'stroke-width':e.width,
    'stroke-dasharray': e.dashed ? '7,5':'none',
    'marker-end': e.arrow === 'none' ? '' : 'url(#arrow-end)',
    style:'color:'+e.color+';', class:'edge-path'
  });
  g.appendChild(path);
  var hit = el('path', {d:d, fill:'none', stroke:'transparent','stroke-width':14, class:'edge-hit'});
  g.appendChild(hit);

  if (e.label){
    var mid = pointAtMid(d);
    var lbl = el('g', {transform:'translate('+mid.x+','+mid.y+')'});
    var padX = Math.max(14, e.label.length * 3.6);
    lbl.appendChild(el('rect', {x:-padX, y:-10, width:padX*2, height:20, fill:'var(--panel)', stroke:'var(--border)', rx:4, ry:4}));
    var t = el('text', {x:0, y:1, 'text-anchor':'middle','dominant-baseline':'central','font-size':11.5, fill:'var(--text)'});
    t.textContent = e.label;
    lbl.appendChild(t);
    g.appendChild(lbl);
  }
  if (sel.edges.has(e.id)){
    var selPath = el('path', {d:d, fill:'none', stroke:'var(--accent)','stroke-width':e.width+4,'stroke-opacity':0.35});
    g.insertBefore(selPath, g.firstChild);
  }
  return g;
}

function pointAtMid(d){
  // crude midpoint: parse first M and last coordinate pair average, plus if multiple segments pick middle segment midpoint
  var nums = d.match(/-?\d+\.?\d*/g).map(Number);
  var pts = [];
  for (var i=0;i<nums.length;i+=2) pts.push({x:nums[i], y:nums[i+1]});
  var mid = pts[Math.floor((pts.length-1)/2)];
  var next = pts[Math.ceil((pts.length-1)/2)];
  return {x:(mid.x+next.x)/2, y:(mid.y+next.y)/2};
}

/* ================= FULL RENDER ================= */
function renderAll(){
  var nodesLayer = document.getElementById('nodes-layer');
  var edgesLayer = document.getElementById('edges-layer');
  nodesLayer.innerHTML = '';
  edgesLayer.innerHTML = '';
  state.edges.forEach(function(e){
    var g = renderEdge(e);
    if (g) edgesLayer.appendChild(g);
  });
  state.nodes.forEach(function(n){
    nodesLayer.appendChild(renderNode(n));
  });
  applyViewportTransform();
  renderMinimap();
  updateGridVisibility();
}
function applyViewportTransform(){
  var vp = document.getElementById('viewport');
  vp.setAttribute('transform', 'translate('+state.viewport.x+','+state.viewport.y+') scale('+state.viewport.scale+')');
}
function updateGridVisibility(){
  var gridRect = document.getElementById('grid-rect');
  gridRect.style.display = state.settings.showGrid ? '' : 'none';
  var pattern = document.getElementById('grid-pattern');
  pattern.setAttribute('width', state.settings.gridSize);
  pattern.setAttribute('height', state.settings.gridSize);
  pattern.querySelector('path').setAttribute('d', 'M'+state.settings.gridSize+',0H0V'+state.settings.gridSize);
}

function renderMinimap(){
  if (!state.settings.showMinimap){ document.getElementById('minimap').classList.add('hidden'); return; }
  document.getElementById('minimap').classList.remove('hidden');
  var svg = document.querySelector('#minimap svg');
  svg.innerHTML = '';
  if (state.nodes.length === 0) return;
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  state.nodes.forEach(function(n){
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x+n.w); maxY = Math.max(maxY, n.y+n.h);
  });
  var pad = 40; minX-=pad; minY-=pad; maxX+=pad; maxY+=pad;
  var w = maxX-minX, h = maxY-minY;
  var scale = Math.min(160/w, 110/h);
  var offX = (160 - w*scale)/2, offY = (110 - h*scale)/2;
  var g = el('g', {transform:'translate('+offX+','+offY+') scale('+scale+') translate('+(-minX)+','+(-minY)+')'});
  state.nodes.forEach(function(n){
    g.appendChild(el('rect', {x:n.x,y:n.y,width:n.w,height:n.h,fill:'var(--accent)','fill-opacity':0.5,stroke:'none'}));
  });
  svg.appendChild(g);
  // viewport rect
  var svgEl = document.getElementById('svg-canvas');
  var rect = svgEl.getBoundingClientRect();
  var vx = -state.viewport.x/state.viewport.scale, vy = -state.viewport.y/state.viewport.scale;
  var vw = rect.width/state.viewport.scale, vh = rect.height/state.viewport.scale;
  var vRect = el('rect', {
    x: minX + (vx-minX), y: minY + (vy-minY), width: vw, height: vh,
    fill:'none', stroke:'var(--text)', 'stroke-width': 1.5/scale
  });
  g.appendChild(vRect);
}
/* ================= NODE / EDGE FACTORY ================= */
function defaultFont(){ return {family:'system-ui, sans-serif', size:13, weight:'normal', italic:false, underline:false, align:'center'}; }
function defaultNodeStyle(){ return {bg: 'var(--node-fill)', border:'var(--node-border)', borderWidth:1.5, borderStyle:'solid', color:'var(--node-text)', opacity:1}; }

function createNode(shape, x, y, text){
  var size = SHAPE_DEFAULT_SIZE[shape] || [120,60];
  var n = {
    id: uid('node'), shape: shape,
    x: snapVal(x - size[0]/2), y: snapVal(y - size[1]/2),
    w: size[0], h: size[1],
    text: text != null ? text : SHAPE_LABEL[shape],
    font: defaultFont(), style: defaultNodeStyle(),
    locked: false, group: null
  };
  state.nodes.push(n);
  return n;
}
function createEdge(fromId, toId, label, fromSide, toSide){
  var e = {
    id: uid('edge'), from: fromId, to: toId,
    fromSide: fromSide||null, toSide: toSide||null,
    type: 'elbow', arrow: 'arrow', color: 'var(--node-border)', width: 1.8,
    label: label || '', dashed: false
  };
  state.edges.push(e);
  return e;
}
function deleteSelection(){
  if (sel.nodes.size === 0 && sel.edges.size === 0) return;
  var ids = new Set(sel.nodes);
  state.edges = state.edges.filter(function(e){
    if (sel.edges.has(e.id)) return false;
    if (ids.has(e.from) || ids.has(e.to)) return false;
    return true;
  });
  state.nodes = state.nodes.filter(function(n){ return !ids.has(n.id); });
  sel.nodes.clear(); sel.edges.clear();
  pushHistory(); renderAll(); renderProperties();
}
function duplicateSelection(){
  if (sel.nodes.size === 0) return;
  var idMap = {};
  var newIds = [];
  sel.nodes.forEach(function(id){
    var n = getNode(id);
    if (!n) return;
    var copy = JSON.parse(JSON.stringify(n));
    copy.id = uid('node'); copy.x += 30; copy.y += 30; copy.locked = false;
    idMap[id] = copy.id;
    state.nodes.push(copy);
    newIds.push(copy.id);
  });
  state.edges.forEach(function(e){
    if (idMap[e.from] && idMap[e.to]){
      var ec = JSON.parse(JSON.stringify(e));
      ec.id = uid('edge'); ec.from = idMap[e.from]; ec.to = idMap[e.to];
      state.edges.push(ec);
    }
  });
  sel.nodes = new Set(newIds); sel.edges.clear();
  pushHistory(); renderAll(); renderProperties();
  toast('Node diduplikasi');

function expandSelectionWithGroups(idSet){
  var groups = new Set();
  idSet.forEach(function(id){ var n = getNode(id); if (n && n.group) groups.add(n.group); });
  if (groups.size === 0) return idSet;
  var out = new Set(idSet);
  state.nodes.forEach(function(n){ if (n.group && groups.has(n.group)) out.add(n.id); });

function onWheel(ev){

function zoomAt(clientX, clientY, factor){
  var rect = svgCanvas.getBoundingClientRect();
  var mx = clientX - rect.left, my = clientY - rect.top;
  var newScale = clamp(state.viewport.scale * factor, 0.15, 4);
  factor = newScale / state.viewport.scale;
  state.viewport.x = mx - (mx - state.viewport.x) * factor;
  state.viewport.y = my - (my - state.viewport.y) * factor;
  state.viewport.scale = newScale;
  applyViewportTransform(); renderMinimap(); updateZoomLabel();
}
function setZoom(scale, center){
  var rect = svgCanvas.getBoundingClientRect();
  var cx = center ? center.x : rect.width/2, cy = center ? center.y : rect.height/2;
  var worldX = (cx - state.viewport.x) / state.viewport.scale;
  var worldY = (cy - state.viewport.y) / state.viewport.scale;
  state.viewport.scale = clamp(scale, 0.15, 4);
  state.viewport.x = cx - worldX * state.viewport.scale;
  state.viewport.y = cy - worldY * state.viewport.scale;
  applyViewportTransform(); renderMinimap(); updateZoomLabel();
}
function updateZoomLabel(){

}
function fitToScreen(){
  if (state.nodes.length === 0){ setZoom(1); state.viewport.x=0; state.viewport.y=0; applyViewportTransform(); return; }
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  state.nodes.forEach(function(n){ minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); maxX=Math.max(maxX,n.x+n.w); maxY=Math.max(maxY,n.y+n.h); });
  var pad = 60; minX-=pad; minY-=pad; maxX+=pad; maxY+=pad;
  var rect = svgCanvas.getBoundingClientRect();
  var scale = clamp(Math.min(rect.width/(maxX-minX), rect.height/(maxY-minY)), 0.15, 2.5);
  state.viewport.scale = scale;
  state.viewport.x = rect.width/2 - ((minX+maxX)/2)*scale;
  state.viewport.y = rect.height/2 - ((minY+maxY)/2)*scale;
  applyViewportTransform(); renderMinimap(); updateZoomLabel();
}

function onPointerDown(ev){
  if (ev.button === 2) return;
  var target = ev.target;
  closeContextMenu();

  // Minimap click/drag pan
  if (target.closest && target.closest('#minimap')){
    handleMinimapPointer(ev);
    drag = {type:'minimap'};
    return;
  }

  var handle = target.closest && target.closest('.resize-handle');
  var connHandle = target.closest && target.closest('.conn-handle');
  var nodeEl = target.closest && target.closest('.node-g');
  var edgeEl = target.closest && target.closest('.edge-g');
  var world = screenToWorld(ev.clientX, ev.clientY);

  if (handle){
    var n = getNode(handle.dataset.node);
    drag = {type:'resize', id:n.id, startW:n.w, startH:n.h, startX:world.x, startY:world.y};
    return;
  }
  if (connHandle){
    drag = {type:'connect', fromId: connHandle.dataset.node, fromSide: connHandle.dataset.side, curX: world.x, curY: world.y};
    ensurePreviewEdgeEl();
    return;
  }

  if (tool === 'shape' && armedShape && !nodeEl){
    var n2 = createNode(armedShape, world.x, world.y);
    pushHistory(); renderAll();
    sel.nodes = new Set([n2.id]); sel.edges.clear(); renderProperties(); renderAll();
    setTool('select');
    return;
  }

  if (nodeEl){
    var id = nodeEl.dataset.id;
    var n3 = getNode(id);
    if (ev.shiftKey){
      if (sel.nodes.has(id)) sel.nodes.delete(id); else sel.nodes.add(id);
      sel.edges.clear(); renderAll(); renderProperties();
      return;
    }
    if (!sel.nodes.has(id)){
      sel.nodes = new Set([id]); sel.edges.clear(); renderAll(); renderProperties();
    }
    if (n3.locked){ return; }
    var moveIds = expandSelectionWithGroups(sel.nodes);
    var startPositions = {};
    moveIds.forEach(function(mid){ var mn = getNode(mid); startPositions[mid] = {x:mn.x, y:mn.y}; });
    drag = {type:'move', ids: Array.from(moveIds), startWorld: world, startPositions: startPositions, moved:false};
    return;
  }

  if (edgeEl){
    var eid = edgeEl.dataset.id;
    if (ev.shiftKey){ if (sel.edges.has(eid)) sel.edges.delete(eid); else sel.edges.add(eid); }
    else { sel.edges = new Set([eid]); sel.nodes.clear(); }
    renderAll(); renderProperties();
    return;
  }

  // empty canvas
  if (tool === 'hand' || ev.button === 1 || ev.spaceKey){
    drag = {type:'pan', startClientX: ev.clientX, startClientY: ev.clientY, startVpX: state.viewport.x, startVpY: state.viewport.y};
    svgCanvas.classList.add('panning');
    return;
  }
  if (tool === 'select'){
    if (!ev.shiftKey){ sel.nodes.clear(); sel.edges.clear(); renderAll(); renderProperties(); }
    drag = {type:'rubber', startClient: {x:ev.clientX,y:ev.clientY}, startWorld: world};
    ensureRubberEl();
  }
}

function onPointerMove(ev){
  if (!drag) return;
  if (drag.type === 'minimap'){ handleMinimapPointer(ev); return; }
  var world = screenToWorld(ev.clientX, ev.clientY);

  if (drag.type === 'move'){
    if (!drag.moved && (Math.abs(ev.clientX - (drag._sx||ev.clientX)) > 0)) {}
    drag.moved = true;
    var dx = world.x - drag.startWorld.x, dy = world.y - drag.startWorld.y;
    drag.ids.forEach(function(id){
      var n = getNode(id);
      if (!n) return;
      var sp = drag.startPositions[id];
      n.x = snapVal(sp.x + dx); n.y = snapVal(sp.y + dy);
    });
    renderAll();
    return;
  }
  if (drag.type === 'resize'){
    var n2 = getNode(drag.id);
    if (!n2) return;
    var nw = snapVal(Math.max(40, drag.startW + (world.x - drag.startX)));
    var nh = snapVal(Math.max(30, drag.startH + (world.y - drag.startY)));
    n2.w = nw; n2.h = nh;
    renderAll();
    return;
  }
  if (drag.type === 'connect'){
    drag.curX = world.x; drag.curY = world.y;
    updatePreviewEdgeEl(drag);
    return;
  }
  if (drag.type === 'pan'){
    state.viewport.x = drag.startVpX + (ev.clientX - drag.startClientX);
    state.viewport.y = drag.startVpY + (ev.clientY - drag.startClientY);
    applyViewportTransform(); renderMinimap();
    return;
  }
  if (drag.type === 'rubber'){
    updateRubberEl(drag.startClient, {x:ev.clientX,y:ev.clientY});
    return;
  }
}

function onPointerUp(ev){
  if (!drag) return;
  if (drag.type === 'move' && drag.moved) pushHistory();
  if (drag.type === 'resize') pushHistory();
  if (drag.type === 'connect'){
    removePreviewEdgeEl();
    var targetNode = document.elementFromPoint(ev.clientX, ev.clientY);
    var nodeEl = targetNode && targetNode.closest && targetNode.closest('.node-g');
    if (nodeEl && nodeEl.dataset.id !== drag.fromId){
      var toSide = null;
      var toNode = getNode(nodeEl.dataset.id);
      var toSideComputed = bestSideForDirection(toNode, sideAnchor(getNode(drag.fromId), drag.fromSide));
      var label = '';
      var fromNode = getNode(drag.fromId);
      if (fromNode.shape === 'decision'){
        var existing = state.edges.filter(function(e){ return e.from === drag.fromId; }).length;
        label = existing === 0 ? 'Ya' : (existing === 1 ? 'Tidak' : '');
      }
      createEdge(drag.fromId, nodeEl.dataset.id, label, drag.fromSide, toSideComputed);
      pushHistory(); renderAll(); renderProperties();
      toast('Koneksi dibuat');
    }
  }
  if (drag.type === 'rubber'){
    finishRubberSelect(drag);
    removeRubberEl();
  }
  if (drag.type === 'pan'){ svgCanvas.classList.remove('panning'); }
  drag = null;
}

function handleMinimapPointer(ev){

  var my = (ev.clientY - rect.top) / rect.height * 110;

  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  state.nodes.forEach(function(n){ minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); maxX=Math.max(maxX,n.x+n.w); maxY=Math.max(maxY,n.y+n.h); });

/* dropdown open/close wiring */
function initDropdowns(){
  document.getElementById('tb-node').addEventListener('click', function(ev){
    ev.stopPropagation();
    var menu = document.getElementById('node-dropdown');
    if (!menu.dataset.built){
      menu.innerHTML = SHAPES.map(function(s){
        return '<div class="dropdown-item" data-shape="'+s.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">'+SHAPE_ICON[s.id]+'</svg>'+s.label+'</div>';
      }).join('');
      menu.dataset.built = '1';
      menu.querySelectorAll('[data-shape]').forEach(function(item){
        item.onclick = function(){
          armedShape = item.dataset.shape;
          tool = 'shape';
          svgCanvas.classList.add('tool-shape');
          menu.classList.remove('open');
          toast('Klik pada canvas untuk menempatkan: ' + SHAPE_LABEL[armedShape]);
        };
      });
    }
    closeAllDropdowns(menu);
    menu.classList.toggle('open');
  });
  document.getElementById('tb-export').addEventListener('click', function(ev){
    ev.stopPropagation();
    var menu = document.getElementById('export-dropdown');
    closeAllDropdowns(menu);
    menu.classList.toggle('open');
  });
  document.getElementById('export-dropdown').querySelectorAll('[data-fn]').forEach(function(item){
    item.addEventListener('click', function(){
      document.getElementById('export-dropdown').classList.remove('open');
      var fn = window[item.dataset.fn];
      if (typeof fn === 'function') fn();
    });
  });
  document.addEventListener('click', function(){ closeAllDropdowns(); });
}
function closeAllDropdowns(except){
  document.querySelectorAll('.dropdown-menu').forEach(function(m){ if (m !== except) m.classList.remove('open'); });
}

function renderProperties(){
  var c = document.getElementById('properties-content');
  var singleNode = sel.nodes.size === 1 ? getNode(Array.from(sel.nodes)[0]) : null;
  var singleEdge = sel.edges.size === 1 && sel.nodes.size === 0 ? getEdge(Array.from(sel.edges)[0]) : null;
  var multiCount = sel.nodes.size + sel.edges.size;

  if (multiCount === 0){
    c.innerHTML = '<div class="prop-empty">Pilih node atau connector untuk mengubah properti.<br><br>Tips: klik shape di sidebar lalu klik canvas untuk menambah node.</div>';

      '<div class="btn-row"><button class="btn danger block" id="mp-delete">Delete</button></div>';

    document.getElementById('mp-copy').onclick = copySelection;

    document.getElementById('mp-group').onclick = groupSelection;

function cssColorToHex(v, fallback){
  if (!v) return fallback;
  if (v.indexOf('var(') === 0) return fallback;
  if (/^#[0-9a-f]{3,8}$/i.test(v)) return v;
  return fallback;
}
function wireNodeProps(n){
  function upd(fn){ fn(); renderAll(); }
  document.getElementById('pn-text').addEventListener('input', function(e){ n.text = e.target.value; renderAll(); });
  document.getElementById('pn-text').addEventListener('blur', function(){ pushHistory(); });
  document.getElementById('pn-shape').addEventListener('change', function(e){ n.shape = e.target.value; pushHistory(); renderAll(); renderProperties(); });
  ['pn-w','pn-h','pn-x','pn-y'].forEach(function(id){
    document.getElementById(id).addEventListener('change', function(e){
      var v = parseFloat(e.target.value) || 0;
      if (id==='pn-w') n.w = Math.max(30, v);
      if (id==='pn-h') n.h = Math.max(24, v);
      if (id==='pn-x') n.x = v;
      if (id==='pn-y') n.y = v;
      pushHistory(); renderAll();
    });
  });
  document.getElementById('pn-fsize').addEventListener('change', function(e){ n.font.size = parseFloat(e.target.value)||13; pushHistory(); renderAll(); });
  document.querySelectorAll('#properties-content .seg button[data-k]').forEach(function(b){
    b.addEventListener('click', function(){
      var k = b.dataset.k;
      if (k==='weight') n.font.weight = n.font.weight==='bold' ? 'normal' : 'bold';
      if (k==='italic') n.font.italic = !n.font.italic;
      if (k==='underline') n.font.underline = !n.font.underline;
      pushHistory(); renderAll(); renderProperties();
    });
  });
  document.querySelectorAll('#properties-content .seg button[data-align]').forEach(function(b){
    b.addEventListener('click', function(){ n.font.align = b.dataset.align; pushHistory(); renderAll(); renderProperties(); });
  });
  document.getElementById('pn-bg').addEventListener('input', function(e){ n.style.bg = e.target.value; renderAll(); });
  document.getElementById('pn-bg').addEventListener('change', function(){ pushHistory(); });
  document.getElementById('pn-color').addEventListener('input', function(e){ n.style.color = e.target.value; renderAll(); });
  document.getElementById('pn-color').addEventListener('change', function(){ pushHistory(); });
  document.getElementById('pn-border').addEventListener('input', function(e){ n.style.border = e.target.value; renderAll(); });

  document.getElementById('pn-opacity').addEventListener('input', function(e){ n.style.opacity = parseFloat(e.target.value); renderAll(); });
  document.getElementById('pn-opacity').addEventListener('change', function(){ pushHistory(); });
  document.getElementById('pn-duplicate').onclick = duplicateSelection;
  document.getElementById('pn-lock').onclick = toggleLockSelection;
  document.getElementById('pn-front').onclick = function(){ bringToFront(n.id); };

/* ================= CONTEXT MENU ================= */
function openContextMenu(x, y, kind, id){
  var menu = document.getElementById('context-menu');
  var items = [];
  if (kind === 'node'){
    var n = getNode(id);
    items.push(['Edit teks','edit-text'],['Duplicate','duplicate'],['Copy','copy'],[n.locked?'Unlock':'Lock','lock'],
      ['Bring to Front','front'],['Send to Back','back']);
    if (n.shape === 'decision') items.push(['+ Cabang Ya/Tidak','branches']);
    items.push(['sep'],['Delete','delete']);
  } else if (kind === 'edge'){
    items.push(['Delete','delete']);
  } else {
    items.push(['Paste','paste'],['Select All','select-all'],['sep'],['Zoom to Fit','fit']);
  }
  menu.innerHTML = items.map(function(it){
    if (it[0]==='sep') return '<div class="ctx-sep"></div>';
    return '<div class="ctx-item" data-act="'+it[1]+'">'+it[0]+'</div>';
  }).join('');
  menu.style.left = x + 'px'; menu.style.top = y + 'px';
  menu.classList.add('open');
  var wrapRect = document.getElementById('canvas-wrap').getBoundingClientRect();
  // reposition relative to canvas-wrap for absolute positioning
  menu.style.position = 'fixed';
  menu.querySelectorAll('.ctx-item').forEach(function(it){
    it.onclick = function(){ handleContextAction(it.dataset.act, kind, id); closeContextMenu(); };
  });
}
function closeContextMenu(){ document.getElementById('context-menu').classList.remove('open'); }
window.addEventListener('scroll', closeContextMenu, true);
function handleContextAction(act, kind, id){
  switch(act){
    case 'edit-text': openTextEditor(getNode(id)); break;
    case 'duplicate': duplicateSelection(); break;
    case 'copy': copySelection(); break;
    case 'lock': toggleLockSelection(); break;
    case 'front': bringToFront(id); break;
    case 'back': sendToBack(id); break;
    case 'branches': addDecisionBranches(id); break;
    case 'delete': deleteSelection(); break;
    case 'paste': pasteClipboard(); break;
    case 'select-all': selectAll(); break;
    case 'fit': fitToScreen(); break;
  }
}

/* ================= KEYBOARD SHORTCUTS ================= */
function initKeyboard(){
  window.addEventListener('keydown', function(ev){
    var tag = (ev.target.tagName||'').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || ev.target.isContentEditable) return;
    var mod = ev.ctrlKey || ev.metaKey;
    if (mod && ev.key.toLowerCase()==='z' && !ev.shiftKey){ ev.preventDefault(); undo(); }
    else if (mod && (ev.key.toLowerCase()==='y' || (ev.key.toLowerCase()==='z' && ev.shiftKey))){ ev.preventDefault(); redo(); }
    else if (mod && ev.key.toLowerCase()==='c'){ ev.preventDefault(); copySelection(); }
    else if (mod && ev.key.toLowerCase()==='v'){ ev.preventDefault(); pasteClipboard(); }
    else if (mod && ev.key.toLowerCase()==='d'){ ev.preventDefault(); duplicateSelection(); }
    else if (mod && ev.key.toLowerCase()==='a'){ ev.preventDefault(); selectAll(); }
    else if (mod && ev.key.toLowerCase()==='s'){ ev.preventDefault(); saveProject(false); }
    else if (ev.key === 'Delete' || ev.key === 'Backspace'){ ev.preventDefault(); deleteSelection(); }
    else if (ev.key === 'Escape'){ clearSelection(); closeContextMenu(); closeAllDropdowns(); }
  });
}

function applyCanvasBg(){
  var pattern = document.getElementById('grid-pattern');
  var path = pattern.querySelector('path');
  if (state.settings.bg === 'dots'){
    path.setAttribute('d','');
    if (!pattern.querySelector('circle')){
      var c = el('circle', {cx: state.settings.gridSize/2, cy: state.settings.gridSize/2, r:1.2, fill:'var(--grid-strong)'});
      pattern.appendChild(c);
    }
  } else {
    var c2 = pattern.querySelector('circle'); if (c2) c2.remove();
    path.setAttribute('d', 'M'+state.settings.gridSize+',0H0V'+state.settings.gridSize);
    path.setAttribute('stroke', state.settings.bg === 'plain' ? 'transparent' : 'var(--grid)');
  }
}
function setTheme(t){
  state.settings.theme = t;
  var actual = t === 'system' ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light':'dark') : t;
  document.documentElement.setAttribute('data-theme', actual);
  persistSettings();
}
function persistSettings(){
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); } catch(e){}
}
function loadSettings(){
  try {
    var raw = localStorage.getItem(SETTINGS_KEY);
    if (raw){ Object.assign(state.settings, JSON.parse(raw)); }
  } catch(e){}
  var actual = state.settings.theme === 'system' ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light':'dark') : state.settings.theme;
  document.documentElement.setAttribute('data-theme', actual);
}

/* ================= PROJECT / LOCALSTORAGE ================= */
function loadAllProjects(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e){ return {}; }
}
function saveAllProjects(obj){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); return true; } catch(e){ toast('Gagal menyimpan: storage penuh','error'); return false; }
}
function saveProject(silent){
  var all = loadAllProjects();
  state.meta.updatedAt = Date.now();
  all[state.meta.id] = { name: state.meta.name, id: state.meta.id, updatedAt: state.meta.updatedAt,
    data: { nodes: state.nodes, edges: state.edges, viewport: state.viewport } };
  var ok = saveAllProjects(all);
  if (ok){ dirty = false; setStatus('Saved · ' + new Date(state.meta.updatedAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})); if (!silent) toast('Proyek disimpan','success'); }
}
function newProject(){
  state.meta = { id: uid('proj'), name: 'Untitled Flowchart', updatedAt: Date.now() };
  state.nodes = []; state.edges = [];
  state.viewport = {x:0,y:0,scale:1};
  sel.nodes.clear(); sel.edges.clear();
  historyStack = []; historyIndex = -1;
  renderAll(); renderProperties(); pushHistory();
  setStatus('Belum disimpan');
  toast('Proyek baru dibuat');
}
function confirmNewProject(){
  if (dirty){ if (!confirm('Perubahan belum disimpan. Buat proyek baru dan buang perubahan?')) return; }
  newProject();
}
function loadProjectById(id){
  var all = loadAllProjects();
  var p = all[id];
  if (!p) return;
  state.meta = { id: p.id, name: p.name, updatedAt: p.updatedAt };
  state.nodes = p.data.nodes || []; state.edges = p.data.edges || [];
  state.viewport = p.data.viewport || {x:0,y:0,scale:1};
  sel.nodes.clear(); sel.edges.clear();
  historyStack = []; historyIndex = -1;
  renderAll(); renderProperties(); pushHistory();
  setStatus('Saved');
  dirty = false;
  closeModal('projects-backdrop');
  toast('Proyek dimuat: ' + p.name);
}
function deleteProjectById(id){
  if (!confirm('Hapus proyek ini secara permanen?')) return;
  var all = loadAllProjects();
  delete all[id];
  saveAllProjects(all);
  openProjectsModal();
}
function renameProjectById(id){
  var all = loadAllProjects();
  var p = all[id]; if (!p) return;
  var name = prompt('Nama baru untuk proyek:', p.name);
  if (!name) return;
  p.name = name;
  if (state.meta.id === id) state.meta.name = name;
  saveAllProjects(all);
  openProjectsModal();
}
function openProjectsModal(){
  var all = loadAllProjects();
  var list = Object.values(all).sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  var el2 = document.getElementById('projects-list');
  if (list.length === 0){
    el2.innerHTML = '<div class="prop-empty">Belum ada proyek tersimpan.</div>';
  } else {
    el2.innerHTML = list.map(function(p){
      var nCount = (p.data.nodes||[]).length;
      return '<div class="proj-row" data-id="'+p.id+'">'+
        '<div class="pinfo"><div class="pname">'+escapeHtml(p.name)+'</div>'+
        '<div class="pmeta">'+nCount+' node · '+new Date(p.updatedAt).toLocaleString('id-ID')+'</div></div>'+
        '<div class="pactions">'+
          '<button class="icon-btn" data-act="load" title="Buka">'+iconSvg('open')+'</button>'+
          '<button class="icon-btn" data-act="rename" title="Rename">'+iconSvg('settings')+'</button>'+
          '<button class="icon-btn" data-act="delete" title="Hapus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>'+
        '</div></div>';
    }).join('');
    el2.querySelectorAll('.proj-row').forEach(function(row){
      var id = row.dataset.id;
      row.querySelector('[data-act="load"]').onclick = function(){ loadProjectById(id); };
      row.querySelector('[data-act="rename"]').onclick = function(){ renameProjectById(id); };
      row.querySelector('[data-act="delete"]').onclick = function(){ deleteProjectById(id); };
    });
  }
  document.getElementById('proj-new-btn').onclick = function(){ confirmNewProject(); closeModal('projects-backdrop'); };
  openModal('projects-backdrop');
}

/* ================= EXPORT ================= */
function fileDateStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function downloadBlob(content, filename, mime){
  var blob = new Blob([content], {type: mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function computeBBox(){
  if (state.nodes.length === 0) return {minX:0,minY:0,maxX:400,maxY:300};
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  state.nodes.forEach(function(n){ minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); maxX=Math.max(maxX,n.x+n.w); maxY=Math.max(maxY,n.y+n.h); });
  var pad = 40;
  return {minX:minX-pad, minY:minY-pad, maxX:maxX+pad, maxY:maxY+pad};
}
function resolveVarColors(svgString){
  var cs = getComputedStyle(document.documentElement);
  var map = {
    '--node-fill':cs.getPropertyValue('--node-fill').trim(), '--node-text':cs.getPropertyValue('--node-text').trim(),
    '--node-border':cs.getPropertyValue('--node-border').trim(), '--panel':cs.getPropertyValue('--panel').trim(),
    '--border':cs.getPropertyValue('--border').trim(), '--text':cs.getPropertyValue('--text').trim(),
    '--accent':cs.getPropertyValue('--accent').trim(), '--canvas-bg':cs.getPropertyValue('--canvas-bg').trim(),
    '--text-faint':cs.getPropertyValue('--text-faint').trim()
  };
  Object.keys(map).forEach(function(k){
    var re = new RegExp('var\\('+k.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&')+'\\)', 'g');
    svgString = svgString.replace(re, map[k]);
  });
  return svgString;
}
function buildExportSvg(){
  var bbox = computeBBox();
  var w = bbox.maxX - bbox.minX, h = bbox.maxY - bbox.minY;
  var svg = el('svg', {xmlns:SVGNS, viewBox: bbox.minX+' '+bbox.minY+' '+w+' '+h, width:w, height:h});
  var defs = document.getElementById('svg-canvas').querySelector('defs').cloneNode(true);
  svg.appendChild(defs);
  var bg = el('rect', {x:bbox.minX, y:bbox.minY, width:w, height:h, fill: getComputedStyle(document.documentElement).getPropertyValue('--canvas-bg').trim()});
  svg.appendChild(bg);
  var edgesLayer = document.getElementById('edges-layer').cloneNode(true);
  var nodesLayer = document.getElementById('nodes-layer').cloneNode(true);
  // strip selection outlines/handles from clone
  nodesLayer.querySelectorAll('.sel-outline,.resize-handle,.conn-handle').forEach(function(x){ x.remove(); });
  edgesLayer.querySelectorAll('.edge-hit').forEach(function(x){ x.remove(); });
  svg.appendChild(edgesLayer); svg.appendChild(nodesLayer);
  var s = new XMLSerializer().serializeToString(svg);
  s = resolveVarColors(s);
  return s;
}
function exportSVG(){
  var svgStr = buildExportSvg();
  downloadBlob('<?xml version="1.0" encoding="UTF-8"?>\n' + svgStr, 'flowchart-'+fileDateStr()+'.svg', 'image/svg+xml');
  toast('SVG diekspor','success');
}
function exportPNG(){
  var svgStr = buildExportSvg();
  var bbox = computeBBox();
  var w = bbox.maxX-bbox.minX, h = bbox.maxY-bbox.minY;
  var scaleFactor = 2;
  var img = new Image();
  var svg64 = btoa(unescape(encodeURIComponent(svgStr)));
  img.onload = function(){
    var canvas = document.createElement('canvas');
    canvas.width = w*scaleFactor; canvas.height = h*scaleFactor;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(function(blob){
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = 'flowchart-'+fileDateStr()+'.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast('PNG diekspor','success');
    }, 'image/png');
  };
  img.onerror = function(){ toast('Gagal membuat PNG','error'); };
  img.src = 'data:image/svg+xml;base64,' + svg64;
}
function exportPDF(){
  var svgStr = buildExportSvg();
  var w = document.open('', '_blank');
  if (!w){ toast('Popup diblokir browser','error'); return; }
  w.document.write('<html><head><title>flowchart-'+fileDateStr()+'</title><style>html,body{margin:0;padding:0;}svg{width:100%;height:auto;display:block;}@media print{@page{margin:12mm;}}</style></head><body>'+svgStr+'</body></html>');
  w.document.close();
  setTimeout(function(){ w.focus(); w.print(); }, 400);
}
function exportJSON(){
  var data = { name: state.meta.name, nodes: state.nodes, edges: state.edges, settings: state.settings };
  downloadBlob(JSON.stringify(data, null, 2), 'flowchart-'+fileDateStr()+'.json', 'application/json');
  toast('JSON diekspor','success');
}
function importJSONPrompt(){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = function(){
    var f = inp.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(reader.result);
        if (!data.nodes || !data.edges) throw new Error('format tidak valid');
        state.nodes = data.nodes; state.edges = data.edges;
        if (data.name) state.meta.name = data.name;
        sel.nodes.clear(); sel.edges
